services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: ghost_shell_chroma
    ports:
      - "8002:8000"
    volumes:
      - ./data/chroma_db:/chroma/chroma
    networks:
      - ghost_network

  ollama:
    image: ollama/ollama:latest
    container_name: ghost_shell_ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    networks:
      - ghost_network

  ollama-init:
    image: ollama/ollama:latest
    container_name: ghost_shell_ollama_init
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: /bin/sh
    command: -c "ollama pull qwen2.5:3b && ollama pull nomic-embed-text"
    networks:
      - ghost_network

  server:
    image: python:3.11-slim
    container_name: ghost_shell_server
    volumes:
      - ./src/server:/app
      - ./data/raw_docs:/data/raw_docs
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    networks:
      - ghost_network

  client:
    image: python:3.11-slim
    container_name: ghost_shell_client
    volumes:
      - ./src/client:/app
    working_dir: /app
    # Mantém o container rodando em background até criarmos o código
    command: sh -c "pip install -r requirements.txt && tail -f /dev/null"
    ports:
      - "8501:8501"
    networks:
      - ghost_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ghost_shell_cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - ghost_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ghost_shell_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - ghost_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ghost_shell_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ghost_network
    depends_on:
      - prometheus
    restart: unless-stopped

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:latest
    container_name: ghost_shell_dcgm
    ports:
      - "9400:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    networks:
      - ghost_network
    restart: unless-stopped

networks:
  ghost_network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data: